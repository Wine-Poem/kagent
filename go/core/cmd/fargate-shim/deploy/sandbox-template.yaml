apiVersion: api.kagent.dev/v1alpha3
kind: SandboxTemplate
metadata: {name: scratch, namespace: kagent}
spec:
  workload:
    image: public.ecr.aws/docker/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
  env:
  - {name: LANG, value: C.UTF-8}
  substrate:
    workerPoolRef: {name: kagent-default}
    snapshotPolicy: {location: "s3://not-used/sandboxes/"}
