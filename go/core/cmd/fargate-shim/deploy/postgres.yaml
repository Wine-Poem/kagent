apiVersion: v1
kind: Secret
metadata: {name: kagent-postgresql-admin, namespace: kagent}
stringData: {password: <set-a-password>}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kagent-postgresql, namespace: kagent, labels: {app: kagent-postgresql}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: kagent-postgresql}}
  template:
    metadata:
      labels: {app: kagent-postgresql, compute-type: fargate}
    spec:
      containers:
      - name: postgresql
        image: docker.io/library/postgres:16-alpine
        env:
        - {name: POSTGRES_DB, value: kagent}
        - {name: POSTGRES_USER, value: postgres}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: kagent-postgresql-admin, key: password}}
        ports: [{containerPort: 5432}]
        readinessProbe: {exec: {command: [pg_isready, -U, postgres, -d, kagent]}, periodSeconds: 3}
        resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: 500m, memory: 1Gi}}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: kagent-postgresql, namespace: kagent}
spec:
  selector: {app: kagent-postgresql}
  ports: [{port: 5432, targetPort: 5432}]
