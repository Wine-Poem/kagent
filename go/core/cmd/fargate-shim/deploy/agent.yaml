apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata: {name: mock-model, namespace: kagent}
spec:
  provider: OpenAI
  model: mock-model
  apiKeySecret: mock-openai
  apiKeySecretKey: OPENAI_API_KEY
  stream: false
  openAI:
    baseUrl: http://mockllm.kagent.svc:8080/v1
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata: {name: fargate-kagent, namespace: kagent}
spec:
  kagent: {}
  workload:
    image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:ae01c3a6d7e0ed2e044253a26abbfb1a9426f3176363842ca9a954762c274d36
  substrate:
    workerPoolRef: {name: kagent-default}
    snapshotPolicy: {location: "s3://not-used/kagent/"}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: probe-agent, namespace: kagent}
spec:
  harnessRef: {name: fargate-kagent}
  template:
    inline:
      modelConfig: {name: mock-model}
      systemPrompt: "You are a probe agent. Answer briefly."
