apiVersion: v1
kind: ServiceAccount
metadata: {name: ate-fargate-shim, namespace: ate-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: ate-fargate-shim}
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch, create, delete]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: ate-fargate-shim}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ate-fargate-shim}
subjects: [{kind: ServiceAccount, name: ate-fargate-shim, namespace: ate-system}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ate-fargate-shim, namespace: ate-system, labels: {app: ate-fargate-shim}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: ate-fargate-shim}}
  template:
    metadata:
      labels: {app: ate-fargate-shim, compute-type: fargate}
    spec:
      serviceAccountName: ate-fargate-shim
      containers:
      - name: shim
        image: <registry>/kagent-fargate-probe:<tag>
        args: ["--suspend-grace=10m", "--actor-cpu=500m", "--actor-memory=1Gi"]
        env:
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        ports: [{name: grpc, containerPort: 8443}, {name: router, containerPort: 8080}]
        readinessProbe: {tcpSocket: {port: 8443}, periodSeconds: 3}
        resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: 250m, memory: 512Mi}}
        volumeMounts: [{name: tls, mountPath: /etc/ate-shim, readOnly: true}]
      volumes: [{name: tls, secret: {secretName: ate-shim-tls}}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: ate-system}
spec:
  selector: {app: ate-fargate-shim}
  ports: [{name: grpc, port: 443, targetPort: 8443}]
---
apiVersion: v1
kind: Service
metadata: {name: atenet-router, namespace: ate-system}
spec:
  selector: {app: ate-fargate-shim}
  ports: [{name: http, port: 80, targetPort: 8080}]
